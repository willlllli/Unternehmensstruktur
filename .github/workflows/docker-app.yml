name: Build and Push Images

on:
  push:
    branches: [main]
    paths:
      - 'app/Dockerfile'
      - 'app/pom.xml'
      - 'app/src/main/**'
      - 'database/Dockerfile'
      - 'database/create.sql'
      - 'database/insert.sql'
  workflow_dispatch:

jobs:
  build-and-push-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ghcr.io/willlllli/unternehmensstruktur:latest

  build-and-push-db:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push db
        uses: docker/build-push-action@v5
        with:
          context: ./database
          push: true
          tags: ghcr.io/willlllli/unternehmensstruktur-db:latest
